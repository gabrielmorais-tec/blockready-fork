<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<title>Criar conta · BLOCKREADY</title>
</head>
<body data-public="true">
<div class="auth-wrap">
  <main class="auth-card">
    <div class="brand"><img src="/assets/logo.svg" alt="" width="36" height="36"><strong>BLOCKREADY</strong></div>
    <h1>Criar conta</h1>
    <div id="erro"></div>
    <form id="form-cadastro">
      <div class="field"><label for="perfil">Tipo de conta</label>
        <select class="select" id="perfil" name="perfil">
          <option value="MORADOR">Morador</option>
          <option value="ORGANIZACAO">Organização parceira</option>
        </select>
        <span class="hint">Contas de gestor e administrador são criadas por um administrador.</span></div>
      <div class="field"><label for="nome">Seu nome</label><input class="input" id="nome" name="nome" required maxlength="120" autocomplete="name"></div>
      <div class="field"><label for="email">E-mail</label><input class="input" id="email" name="email" type="email" required maxlength="160" autocomplete="username"></div>
      <div class="field"><label for="telefone">Telefone (opcional)</label><input class="input" id="telefone" name="telefone" maxlength="30" autocomplete="tel"></div>
      <div class="field"><label for="senha">Senha</label><input class="input" id="senha" name="senha" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><span class="hint">Entre 8 e 72 caracteres.</span></div>

      <fieldset class="group" id="bloco-org" hidden>
        <legend>Dados da organização</legend>
        <div class="field"><label for="orgNome">Nome da organização</label><input class="input" id="orgNome" data-req maxlength="160"></div>
        <div class="field"><label for="tipoOrg">Categoria</label><select class="select" id="tipoOrg" data-req></select></div>
        <div class="field"><label for="orgResponsavel">Responsável</label><input class="input" id="orgResponsavel" data-req maxlength="120"></div>
        <div class="field"><label for="orgDescricao">Descrição</label><textarea class="textarea" id="orgDescricao" maxlength="2000"></textarea></div>
        <div class="field"><label for="orgEmail">E-mail de contato</label><input class="input" id="orgEmail" type="email" maxlength="160"></div>
        <div class="field"><label for="orgTelefone">Telefone de contato</label><input class="input" id="orgTelefone" maxlength="30"></div>
        <div class="field"><label for="orgEndereco">Endereço</label><input class="input" id="orgEndereco" maxlength="300"></div>
        <p class="panel-note">A organização será analisada por um gestor comunitário antes de cadastrar recursos.</p>
      </fieldset>

      <div class="form-actions"><button class="btn btn-primary" type="submit">Criar conta</button><a class="btn btn-secondary" href="/login.html">Já tenho conta</a></div>
    </form>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/cadastro.js"></script>
</body>
</html>
