spring:
  application:
    name: blockready
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blockready}
    username: ${DB_USER:blockready}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${APP_PORT:8080}
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

blockready:
  version: @project.version@
  planning-horizon-hours: 72
  # Primeiro administrador (criado só se ainda não existir nenhum). Sem valores, nada é criado.
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    br.com.blockready: ${LOG_LEVEL_APP:INFO}
